# nginx-onboarding.conf
# Reverse-Proxy für das M365-Onboarding-Tool (Node.js auf 127.0.0.1:3000).
#
# Ablage auf dem Server:
#   /etc/nginx/sites-available/onboarding.certnet.eu
# Aktivieren:
#   ln -s /etc/nginx/sites-available/onboarding.certnet.eu /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS wird anschliessend per certbot ergänzt:
#   certbot --nginx -d onboarding.certnet.eu
# certbot fügt den 443-Server-Block und die Zertifikatspfade automatisch ein
# und richtet die Weiterleitung von HTTP auf HTTPS ein.

server {
    listen 80;
    listen [::]:80;
    server_name onboarding.certnet.eu;

    # Maximale Upload-Grösse (das Tool nutzt nur kleine Formular-POSTs).
    client_max_body_size 1m;

    access_log /var/log/nginx/onboarding.access.log;
    error_log  /var/log/nginx/onboarding.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Wichtig: damit die App (trust proxy + Secure-Cookies) das
        # Original-Protokoll erkennt.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }
}
