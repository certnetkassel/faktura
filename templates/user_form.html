{% extends "base.html" %}
{% block title %}{{ 'Benutzer bearbeiten' if user else 'Neuer Benutzer' }} — Faktura{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Benutzer bearbeiten' if user else 'Neuer Benutzer' }}</h1>
</div>
<form method="POST">
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>Vorname</label>
        <input type="text" name="first_name" value="{{ form.first_name if form.first_name else '' }}">
      </div>
      <div class="form-group">
        <label>Nachname</label>
        <input type="text" name="last_name" value="{{ form.last_name if form.last_name else '' }}">
      </div>
      <div class="form-group full">
        <label>E-Mail *</label>
        <input type="email" name="email" value="{{ form.email if form.email else '' }}" autocomplete="off" required>
      </div>
      <div class="form-group full">
        <label>Passwort {% if user %}(leer = unverändert){% else %}*{% endif %}</label>
        <input type="password" name="password" autocomplete="new-password"
               placeholder="{% if user %}Nur ausfüllen, um das Passwort zu ändern{% else %}Passwort festlegen…{% endif %}"
               {% if not user %}required{% endif %}>
      </div>
      <div class="form-group full">
        <label class="checkbox-option">
          <input type="checkbox" name="is_admin" value="1" {% if form.is_admin %}checked{% endif %}>
          <span>Administrator (darf Benutzer verwalten)</span>
        </label>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <button type="submit" class="btn btn-primary">Speichern</button>
    <a href="{{ url_for('users') }}" class="btn btn-secondary">Abbrechen</a>
  </div>
</form>
{% endblock %}
