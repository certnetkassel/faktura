{% extends "base.html" %}
{% block title %}Mahnung erstellen — Faktura{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ level }}. Mahnung erstellen</h1>
</div>

<div class="card" style="margin-bottom:20px">
  <div class="card-header"><h2>Rechnungsdaten</h2></div>
  <div class="form-grid">
    <div class="form-group">
      <label>Rechnung</label>
      <input type="text" value="{{ invoice.invoice_nr }}" disabled>
    </div>
    <div class="form-group">
      <label>Kunde</label>
      <input type="text" value="{{ invoice.last_name }}{% if invoice.company %} ({{ invoice.company }}){% endif %}" disabled>
    </div>
    <div class="form-group">
      <label>Betrag</label>
      <input type="text" value="{{ '%.2f'|format(invoice.total) }} €" disabled>
    </div>
    <div class="form-group">
      <label>Fällig seit</label>
      <input type="text" value="{{ invoice.due_date|fmt_date }}" disabled>
    </div>
  </div>
</div>

<form method="POST">
  <div class="card">
    <div class="card-header"><h2>Mahnung</h2></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Mahnstufe</label>
        <select name="level">
          <option value="1" {{ 'selected' if level==1 }}>1. Mahnung (Zahlungserinnerung)</option>
          <option value="2" {{ 'selected' if level==2 }}>2. Mahnung</option>
          <option value="3" {{ 'selected' if level==3 }}>3. Mahnung (letzte Mahnung)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mahngebühr (€)</label>
        <input type="number" name="fee" step="0.01" value="{% if level >= 2 %}5.00{% else %}0.00{% endif %}">
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" name="date" value="{{ today }}" required>
      </div>
      <div class="form-group">
        <label>Zahlungsfrist</label>
        <input type="date" name="due_date" value="{{ due }}" required>
      </div>
      <div class="form-group full">
        <label>Notizen</label>
        <textarea name="notes" rows="2"></textarea>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <button type="submit" class="btn btn-danger">Mahnung erstellen</button>
    <a href="{{ url_for('reminders') }}" class="btn btn-secondary">Abbrechen</a>
  </div>
</form>
{% endblock %}
