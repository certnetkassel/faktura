{% extends "base.html" %}
{% block title %}{{ 'Artikel bearbeiten' if a else 'Neuer Artikel' }} — Faktura{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Artikel bearbeiten' if a else 'Neuer Artikel' }}</h1>
</div>
<form method="POST">
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>Artikelnummer</label>
        <input type="text" name="article_nr" value="{{ a.article_nr if a else next_nr }}" required>
      </div>
      <div class="form-group">
        <label>Bezeichnung *</label>
        <input type="text" name="name" value="{{ a.name if a else '' }}" required>
      </div>
      <div class="form-group full">
        <label>Beschreibung</label>
        <textarea name="description">{{ a.description if a else '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Einheit</label>
        <select name="unit">
          {% for u in ['Stunde','Stück','Pauschal','Tag','Monat','Projekt'] %}
          <option value="{{ u }}" {{ 'selected' if a and a.unit==u }}>{{ u }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Einzelpreis (€)</label>
        <input type="number" name="price" step="0.01" value="{{ '%.2f'|format(a.price) if a else '0.00' }}">
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px">
    <button type="submit" class="btn btn-primary">Speichern</button>
    <a href="{{ url_for('articles') }}" class="btn btn-secondary">Abbrechen</a>
  </div>
</form>
{% endblock %}
